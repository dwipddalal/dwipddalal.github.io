<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>visuals</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0E14; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 8px 60px; }
  video { display: block; width: 100%; border-radius: 10px; margin: 0 0 26px; background: #0A0E14; }
  hr { border: none; border-top: 2px solid #3B4C63; margin: 44px 0; }
</style>
</head>
<body>
<!-- BUILD:6a872326 -->
<main>
  <!-- T1 - high-level video -->
  <video src="01_lead_teaser_v3.mp4" controls muted playsinline preload="metadata"></video>
  <!-- T2 - forgetting -->
  <video src="03_bc_forgets_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- T3 - anchoring -->
  <video src="15_arch_anchoring_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- T4 - alignment -->
  <video src="16_arch_alignment_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- T5 - significance -->
  <video src="13_generalization_pairs_v5.mp4" controls muted loop playsinline preload="metadata"></video>
  <hr>
  <!-- not used in the tweets -->
  <video src="14_arch_standard_bc_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="05_anchor_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="06_align_v2.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="04_cotraining_misaligned_v3.mp4" controls muted loop playsinline preload="metadata"></video>

  <video src="02_lead_alt_thumb_swap.mp4" controls muted loop playsinline preload="metadata"></video>
</main>
<script>
  const vids = document.querySelectorAll("video");
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) { e.target.play().catch(() => {}); }
      else { e.target.pause(); }
    }
  }, { threshold: 0.4 });
  vids.forEach(v => io.observe(v));
</script>
<script>
(async () => {
  const cur = (document.documentElement.outerHTML.match(/BUILD:([0-9a-z]+)/) || [])[1];
  try {
    const r = await fetch(location.pathname + "?nocache=" + Date.now(), {cache: "no-store"});
    const t = await r.text();
    const fresh = (t.match(/BUILD:([0-9a-z]+)/) || [])[1];
    if (cur && fresh && cur !== fresh) { document.open(); document.write(t); document.close(); }
  } catch (e) {}
})();
</script>
</body>
</html>
