<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>visuals</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0E14; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 8px 60px; }
  video { display: block; width: 100%; border-radius: 10px; margin: 0 0 26px; background: #0A0E14; }
</style>
</head>
<body>
<main>
  <!-- Tweet 1 - motivation -->
  <video src="01_lead_teaser.mp4" controls muted playsinline preload="metadata"></video>
  <video src="13_generalization_pairs_v3.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Tweet 2 - forgetting -->
  <video src="03_bc_forgets.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="14_arch_standard_bc.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Tweet 3 - misalignment -->
  <video src="04_cotraining_misaligned.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="17_alignment_chart.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Tweet 4 - anchoring -->
  <video src="15_arch_anchoring.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="05_anchor.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Tweet 5 - alignment -->
  <video src="16_arch_alignment.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="06_align.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Tweet 6 - results -->
  <video src="09_sim_numbers_chart.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="10_sim_swap_grid.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="11_real_robot.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="08_control_chart.mp4" controls muted loop playsinline preload="metadata"></video>
  <!-- Reference / extras -->
  <video src="12_method_abstract_v10.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="07_one_training_step.mp4" controls muted loop playsinline preload="metadata"></video>
  <video src="02_lead_alt_thumb_swap.mp4" controls muted loop playsinline preload="metadata"></video>
</main>
<script>
  const vids = document.querySelectorAll("video");
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (e.isIntersecting) { e.target.play().catch(() => {}); }
      else { e.target.pause(); }
    }
  }, { threshold: 0.4 });
  vids.forEach(v => io.observe(v));
</script>
</body>
</html>
